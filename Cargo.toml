[workspace]
members = ["crates/ont-core", "crates/ont-store", "crates/ont-daemon", "crates/ont"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"

[workspace.dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
rusqlite = { version = "=0.32.1", features = ["bundled"] }
sha2 = "=0.10.9"
ont-core = { path = "crates/ont-core", version = "=0.1.0" }
ont-store = { path = "crates/ont-store", version = "=0.1.0" }
ont = { path = "crates/ont", version = "=0.1.0" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
